<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Book a table at Seoul Bites." />
    <title>Book a Table | Seoul Bites</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>" />
    <script>
      // Apply the saved theme and language before the page is drawn, so it doesn't flash.
      (function () {
        var theme, lang;
        try { theme = localStorage.getItem("seoulBitesTheme"); lang = localStorage.getItem("seoulBitesLang"); } catch (e) {}
        var root = document.documentElement;
        root.dataset.theme = theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (lang === "ar") { root.lang = "ar"; root.dir = "rtl"; }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-title="page.book">
    <header id="top">
      <a class="logo" href="index.html">Seoul Bites</a>
      <nav>
        <a href="index.html" data-i18n="nav.menu">Menu</a>
        <a href="form.html" aria-current="page" data-i18n="nav.book">Book a Table</a>
        <button class="toggle" id="langToggle" type="button">عربي</button>
        <button class="toggle" id="themeToggle" type="button" aria-label="Switch to dark mode">🌙</button>
      </nav>
    </header>

    <main class="form-page">
      <div class="form-container">
        <h1 data-i18n="book.title">Book a Table</h1>
        <p class="hint" data-i18n="book.hours">Open every day from 12:00 PM to 11:00 PM.</p>

        <form id="bookingForm" novalidate>
          <label for="name" data-i18n="book.name">Full Name</label>
          <input type="text" id="name" name="name" autocomplete="name" placeholder="Enter your name" data-i18n-placeholder="book.namePlaceholder" />
          <p class="error" id="nameError"></p>

          <label for="email" data-i18n="book.email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="name@example.com" dir="ltr" />
          <p class="error" id="emailError"></p>

          <label for="phone" data-i18n="book.phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="01xxxxxxxxx" dir="ltr" />
          <p class="error" id="phoneError"></p>

          <label for="guests" data-i18n="book.guests">Number of Guests</label>
          <input type="number" id="guests" name="guests" min="1" max="12" placeholder="1 - 12" />
          <p class="error" id="guestsError"></p>

          <div class="form-row">
            <div>
              <label for="date" data-i18n="book.date">Date</label>
              <input type="date" id="date" name="date" />
              <p class="error" id="dateError"></p>
            </div>
            <div>
              <label for="time" data-i18n="book.time">Time</label>
              <input type="time" id="time" name="time" min="12:00" max="23:00" step="1800" />
              <p class="error" id="timeError"></p>
            </div>
          </div>

          <button class="primary whatsapp" type="submit" data-i18n="book.submit">Book on WhatsApp</button>
          <p class="note" data-i18n="book.note">Your booking is sent to the restaurant on WhatsApp.</p>
        </form>

        <div class="success hidden" id="confirmation" role="status"></div>
      </div>
    </main>

    <a class="whatsapp-float" id="whatsappChat" href="https://wa.me/201224003220" target="_blank" rel="noopener" aria-label="Chat with us on WhatsApp" data-i18n-aria="chat.label">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.42.25-.7.25-1.29.17-1.42-.07-.12-.27-.2-.57-.35zM12.05 21.5h-.01a9.4 9.4 0 0 1-4.8-1.31l-.34-.2-3.57.94.95-3.48-.22-.36a9.4 9.4 0 0 1-1.44-5.01c0-5.2 4.23-9.43 9.44-9.43 2.52 0 4.89.98 6.67 2.77a9.37 9.37 0 0 1 2.76 6.67c0 5.2-4.23 9.43-9.44 9.43zm8.03-17.46A11.27 11.27 0 0 0 12.05.72C5.8.72.7 5.8.7 12.07c0 2 .52 3.95 1.52 5.67L.6 23.28l5.68-1.49a11.3 11.3 0 0 0 5.76 1.47h.01c6.26 0 11.35-5.09 11.35-11.35 0-3.03-1.18-5.88-3.32-8.02z"/></svg>
    </a>

    <footer>
      <p>&copy; <span id="year"></span> Seoul Bites. <span data-i18n="footer.rights">All rights reserved.</span></p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
