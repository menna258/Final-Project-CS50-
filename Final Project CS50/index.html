<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Seoul Bites - authentic Korean food. Browse the menu, order online and book a table." />
    <title>Seoul Bites | Korean Food Menu</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="top">
      <a class="logo" href="index.html">Seoul Bites</a>
      <nav>
        <a href="index.html" aria-current="page">Menu</a>
        <a href="form.html">Book a Table</a>
        <button class="cart-button" id="cartButton" type="button" aria-controls="cart" aria-expanded="false">
          Cart <span class="cart-count" id="cartCount">0</span>
        </button>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>Authentic Korean food, made fresh</h1>
        <p>Pick your favourite dishes, add them to your cart and order in seconds.</p>
      </section>

      <section class="toolbar" aria-label="Filter the menu">
        <label class="visually-hidden" for="search">Search dishes</label>
        <input type="search" id="search" placeholder="Search dishes..." autocomplete="off" />
        <div class="categories" id="categories" role="group" aria-label="Categories"></div>
      </section>

      <section class="menu" id="menu" aria-live="polite"></section>
      <p class="empty hidden" id="noResults">No dishes match your search.</p>
    </main>

    <div class="overlay hidden" id="overlay"></div>
    <aside class="cart" id="cart" aria-label="Your cart" aria-hidden="true">
      <div class="cart-header">
        <h2>Your Cart</h2>
        <button class="icon-button" id="closeCart" type="button" aria-label="Close cart">&times;</button>
      </div>
      <ul class="cart-items" id="cartItems"></ul>
      <p class="empty" id="cartEmpty">Your cart is empty.</p>
      <div class="cart-footer">
        <div class="cart-total">
          <span>Total</span>
          <strong id="cartTotal">0 EGP</strong>
        </div>
        <button class="primary" id="checkout" type="button">Place Order</button>
        <p class="success hidden" id="orderConfirmation" role="status"></p>
      </div>
    </aside>

    <footer>
      <p>&copy; <span id="year"></span> Seoul Bites. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
